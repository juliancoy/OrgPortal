name: Release OrgPortal Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "web/**"
      - "shared/**"
      - "run.py"
      - ".github/workflows/release-image.yml"
  pull_request:
    paths: ["web/**", "shared/**", ".github/workflows/release-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image before publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          load: true
          tags: orgportal-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the runtime image
        run: |
          docker run --detach --name orgportal-ci --publish 8080:8080 orgportal-ci:local
          trap 'docker logs orgportal-ci; docker rm --force orgportal-ci' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/not-a-route)" = 404

  build-and-publish:
    needs: check-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orgportal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=orgportal

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

